---
# Ubuntu workstation setup.
# Converts: install-dotfiles + everything under install/ubuntu/.
#
#   ansible-playbook ubuntu.yml -K
#
# Plays run as the login user; tasks that need root use `become: true`
# individually, so ~ and ansible_env.HOME always mean YOUR home.

- name: Provision Ubuntu machine with dotfiles and tools
  hosts: all
  become: false

  pre_tasks:
    - name: Verify this is a Debian-family system
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: "This playbook targets Ubuntu/Debian systems. Use rhel.yml for RHEL-family hosts."

    - name: Install base packages needed by later tasks
      become: true
      ansible.builtin.apt:
        name:
          - curl
          - tar
          - unzip
          - xz-utils
          - git
        state: present
        update_cache: true
      when: not offline

    - name: Copy staged DEB bundle to the target (offline)
      become: true
      ansible.builtin.copy:
        src: "{{ offline_dir }}/debs"
        dest: /tmp/
      when: offline

    - name: Configure the bundle as a local apt repo (offline)
      become: true
      ansible.builtin.copy:
        content: "deb [trusted=yes] file:///tmp/debs ./\n"
        dest: /etc/apt/sources.list.d/offline.list
        mode: "0644"
      when: offline

    # Refresh indexes from the local repo only — the regular internet
    # sources are unreachable on an air-gapped host anyway.
    - name: Refresh apt indexes from the local repo (offline)
      become: true
      ansible.builtin.command: >-
        apt-get update
        -o Dir::Etc::sourcelist=sources.list.d/offline.list
        -o Dir::Etc::sourceparts=/dev/null
      changed_when: false
      when: offline

    # Later apt tasks (thefuck, bat, fontconfig) resolve from the same local
    # repo, so installing the bundle here also pre-satisfies them.
    - name: Install staged DEB bundle (offline)
      become: true
      ansible.builtin.apt:
        name: "{{ offline_deb_packages }}"
        state: present
      when: offline

  tasks:
    - name: Link dotfiles
      ansible.builtin.import_tasks: tasks/dotfiles.yml
      tags: dotfiles

    - name: Set up tmux and TPM
      ansible.builtin.import_tasks: tasks/tmux.yml
      tags: tmux

    - name: Install thefuck
      ansible.builtin.import_tasks: tasks/thefuck.yml
      tags: thefuck

    - name: Install ShellCheck
      ansible.builtin.import_tasks: tasks/shellcheck.yml
      tags: shellcheck

    - name: Install ncdu
      ansible.builtin.import_tasks: tasks/ncdu.yml
      tags: ncdu

    - name: Install bat
      ansible.builtin.import_tasks: tasks/bat.yml
      tags: bat

    - name: Install figurine and SSH banner
      ansible.builtin.import_tasks: tasks/figurine.yml
      tags: figurine

    - name: Install dysk
      ansible.builtin.import_tasks: tasks/dysk.yml
      tags: dysk

    - name: Install tealdeer (tldr)
      ansible.builtin.import_tasks: tasks/tealdeer.yml
      tags: tealdeer

    - name: Install inxi
      ansible.builtin.import_tasks: tasks/inxi.yml
      tags: inxi

    - name: Install duf
      ansible.builtin.import_tasks: tasks/duf.yml
      tags: duf

    - name: Install JetBrainsMono Nerd Font
      ansible.builtin.import_tasks: tasks/fonts.yml
      tags: fonts

    - name: Install pomo
      ansible.builtin.import_tasks: tasks/pomo.yml
      tags: pomo

    # Brew runs last on purpose: it's the only task set with hard external
    # requirements (internet + non-root), so a failure or skip here can never
    # block the rest of the setup.
    - name: Install Homebrew
      ansible.builtin.import_tasks: tasks/brew.yml
      tags: brew

  handlers:
    - name: Refresh font cache
      ansible.builtin.command: fc-cache -f

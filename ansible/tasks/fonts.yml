---
# Replaces install/ubuntu/install-fonts: installs the JetBrainsMono Nerd Font
# into ~/.local/share/fonts and refreshes the font cache.

- name: Install font tooling
  become: true
  ansible.builtin.apt:
    name:
      - fontconfig
      - xz-utils
    state: present

- name: Ensure user font directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
    state: directory
    mode: "0755"

# Online: download on the target. Offline: extract the staged archive.
- name: Download and extract JetBrainsMono Nerd Font
  ansible.builtin.unarchive:
    src: "{{ (offline_dir ~ '/JetBrainsMono.tar.xz') if offline else nerd_font_url }}"
    dest: "{{ ansible_facts.env.HOME }}/.local/share/fonts"
    remote_src: "{{ not offline }}"
    creates: "{{ ansible_facts.env.HOME }}/.local/share/fonts/JetBrainsMonoNerdFont-Regular.ttf"
  notify: Refresh font cache

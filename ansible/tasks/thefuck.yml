---
# Replaces install/rhel/install-thefuck; now also covers Ubuntu. The original
# also appended `eval "$(thefuck --alias)"` and `alias fk=fuck` to ~/.bashrc;
# those lines already live in the repo's aliases file (guarded), so only the
# tool is installed here.
#
# RHEL installs via pip (no RPM exists); Ubuntu has a native apt package.

- name: Install Python and pip (RHEL)
  become: true
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - python3-devel
    state: present
  when: ansible_facts['os_family'] == 'RedHat' and not offline

- name: Install thefuck via pip (RHEL)
  become: true
  ansible.builtin.pip:
    name: thefuck
    executable: pip3
  when: ansible_facts['os_family'] == 'RedHat' and not offline

# Offline Ubuntu gets thefuck from the DEB bundle via the apt task below,
# so the wheels path is RHEL-only.
- name: Copy staged thefuck wheels to the target (offline)
  ansible.builtin.copy:
    src: "{{ offline_dir }}/wheels/"
    dest: /tmp/thefuck-wheels/
  when: offline and ansible_facts['os_family'] == 'RedHat'

- name: Install thefuck from staged wheels (offline)
  become: true
  ansible.builtin.pip:
    name: thefuck
    executable: pip3
    extra_args: "--no-index --find-links=/tmp/thefuck-wheels"
  when: offline and ansible_facts['os_family'] == 'RedHat'

- name: Install thefuck (Ubuntu)
  become: true
  ansible.builtin.apt:
    name: thefuck
    state: present
  when: ansible_facts['os_family'] == 'Debian'

# Ubuntu 24.04's thefuck 3.29 still does `from imp import load_source`, but
# the imp module was removed in Python 3.12 (noble's own python3) — the
# package is broken out of the box and upstream's fix was never released.
# Shim load_source with importlib in the two affected files. Idempotent: once
# patched, the anchored regexp no longer matches. Works offline too.
- name: Patch thefuck for Python 3.12 (imp module removed)
  become: true
  ansible.builtin.replace:
    path: "/usr/share/thefuck/thefuck/{{ item }}"
    regexp: '^from imp import load_source$'
    replace: |-
      try:
          from imp import load_source
      except ImportError:
          from importlib.util import module_from_spec, spec_from_file_location

          def load_source(name, pathname, *args):
              spec = spec_from_file_location(name, pathname)
              module = module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
  loop:
    - conf.py
    - types.py
  when: ansible_facts['os_family'] == 'Debian'

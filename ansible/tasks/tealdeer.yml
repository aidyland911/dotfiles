---
# Replaces install/rhel/install-tldr. The original installed a Fedora 43 RPM,
# which is incompatible with RHEL 9 (newer glibc/rpm deps); tealdeer is not in
# EPEL, so install the upstream static musl binary instead — it runs on any
# RHEL version. The tldr page cache is still seeded manually because
# `tldr --update` can fail behind proxies.

- name: Install tealdeer static binary as /usr/local/bin/tldr
  become: true
  ansible.builtin.get_url:
    url: "{{ tealdeer_url }}"
    dest: /usr/local/bin/tldr
    mode: "0755"
  when: not offline

- name: Install staged tealdeer binary (offline)
  become: true
  ansible.builtin.copy:
    src: "{{ offline_dir }}/tealdeer"
    dest: /usr/local/bin/tldr
    mode: "0755"
  when: offline

- name: Ensure tealdeer cache directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.cache/tealdeer/tldr-pages"
    state: directory
    mode: "0755"

# Online: download on the target. Offline: extract the staged zip.
- name: Download and extract tldr pages into the cache
  ansible.builtin.unarchive:
    src: "{{ (offline_dir ~ '/tldr.zip') if offline else tldr_pages_url }}"
    dest: "{{ ansible_facts.env.HOME }}/.cache/tealdeer/tldr-pages"
    remote_src: "{{ not offline }}"
    creates: "{{ ansible_facts.env.HOME }}/.cache/tealdeer/tldr-pages/pages"

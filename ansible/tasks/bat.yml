---
# Replaces install/rhel/install-bat. The original downloaded a hardcoded
# EPEL 10 RPM, which fails on RHEL 9; instead, enable the EPEL repo matching
# the host's major version and install bat from it. The MANPAGER export the
# original appended to ~/.bashrc already lives in the repo's bashrc (guarded
# so it only activates when bat is present).

# Offline targets get bat from the staged RPM bundle (rhel.yml pre_tasks),
# so both tasks here are online-only.
- name: Enable EPEL repository
  become: true
  ansible.builtin.dnf:
    name: "{{ epel_release_url }}"
    state: present
    disable_gpg_check: true
  when: not offline

- name: Install bat from EPEL
  become: true
  ansible.builtin.dnf:
    name: bat
    state: present
  when: not offline

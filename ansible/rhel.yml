---
# RHEL workstation setup.
# Converts: install-dotfiles + everything under install/rhel/.
#
#   ansible-playbook rhel.yml -K
#
# Plays run as the login user; tasks that need root use `become: true`
# individually, so ~ and ansible_env.HOME always mean YOUR home.

- name: Provision RHEL machine with dotfiles and tools
  hosts: all
  become: false

  pre_tasks:
    - name: Verify this is a RHEL-family system
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'RedHat'
        fail_msg: "This playbook targets RHEL-family systems. Use ubuntu.yml for Debian-family hosts."

    # No curl/wget here: Ansible downloads via Python, and full curl conflicts
    # with curl-minimal on RHEL 9 minimal installs.
    - name: Install base packages needed by later tasks
      become: true
      ansible.builtin.dnf:
        name:
          - tar
          - unzip
          - xz
          - git
        state: present
      when: not offline

    - name: Copy staged RPM bundle to the target (offline)
      become: true
      ansible.builtin.copy:
        src: "{{ offline_dir }}/rpms"
        dest: /tmp/
      when: offline

    # The staged bundle is used as a local dnf repo and only the wanted
    # packages are requested — dnf then resolves minimally against what is
    # already installed. Installing every RPM in the bundle instead would
    # force base-library upgrades (systemd-libs, ...) that cannot complete
    # with repos disabled and trip dnf's protected-package check.
    - name: Install staged RPM bundle (offline)
      become: true
      ansible.builtin.shell: >-
        dnf install -y --nogpgcheck
        --disablerepo='*'
        --repofrompath=offline,file:///tmp/rpms
        --enablerepo=offline
        {{ offline_rpm_packages | join(' ') }}
      register: rpm_bundle
      changed_when: "'Nothing to do' not in rpm_bundle.stdout"
      when: offline

  tasks:
    - name: Link dotfiles
      ansible.builtin.import_tasks: tasks/dotfiles.yml
      tags: dotfiles

    - name: Set up tmux and TPM
      ansible.builtin.import_tasks: tasks/tmux.yml
      tags: tmux

    - name: Install thefuck
      ansible.builtin.import_tasks: tasks/thefuck.yml
      tags: thefuck

    - name: Install ShellCheck
      ansible.builtin.import_tasks: tasks/shellcheck.yml
      tags: shellcheck

    - name: Install ncdu
      ansible.builtin.import_tasks: tasks/ncdu.yml
      tags: ncdu

    - name: Install bat
      ansible.builtin.import_tasks: tasks/bat.yml
      tags: bat

    - name: Install figurine and SSH banner
      ansible.builtin.import_tasks: tasks/figurine.yml
      tags: figurine

    - name: Install dysk
      ansible.builtin.import_tasks: tasks/dysk.yml
      tags: dysk

    - name: Install tealdeer (tldr)
      ansible.builtin.import_tasks: tasks/tealdeer.yml
      tags: tealdeer

    - name: Install inxi
      ansible.builtin.import_tasks: tasks/inxi.yml
      tags: inxi

    - name: Install duf
      ansible.builtin.import_tasks: tasks/duf.yml
      tags: duf

    - name: Install pomo
      ansible.builtin.import_tasks: tasks/pomo.yml
      tags: pomo

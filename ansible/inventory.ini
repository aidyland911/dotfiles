# This machine. Target it alone with: --limit localhost
localhost ansible_connection=local

# Air-gapped cluster nodes (no internet). Workflow from the jumpbox:
#   1. ansible-playbook -i inventory.ini fetch-offline.yml
#   2. ansible-playbook -i inventory.ini rhel.yml --limit airgapped
[airgapped]
automation1 ansible_user=root
# automation2 ansible_user=root
# ubuntu-node1 ansible_user=root   # Ubuntu targets work too: ubuntu.yml --limit <host>

